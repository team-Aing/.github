name: 버그 제보
description: 실행 중 발생한 오류를 알려요
title: "[버그] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제인가요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 실행 환경
      placeholder: |
        OS: Windows 11
        Python: 3.11
        실행 명령: uv run main.py
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 오류 로그
      render: shell
    validations:
      required: false
